<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 底板：青瓷绿，左上受光、右下压深。
         斜向渐变比竖直渐变更像「一块有厚度的材料」，不会看成纯色方块。 -->
    <linearGradient id="bg" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#4f8a6d"/>
      <stop offset="0.55" stop-color="#3a6b53"/>
      <stop offset="1" stop-color="#274b39"/>
    </linearGradient>

    <!-- 纸面：暖白，顶部亮、底部略沉 -->
    <linearGradient id="paper" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#fffefb"/>
      <stop offset="1" stop-color="#ece8e0"/>
    </linearGradient>

    <!-- 折过来的那一角是纸的背面，要比正面暗一档 -->
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcd6cb"/>
      <stop offset="1" stop-color="#c0b9ac"/>
    </linearGradient>

    <filter id="pageShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#16301f" flood-opacity="0.34"/>
    </filter>
  </defs>

  <!-- 圆角底板 -->
  <rect x="0" y="0" width="512" height="512" rx="118" fill="url(#bg)"/>

  <!-- 纸面：右上角折下一角。
       折角是这块图标唯一「不像别人」的地方 —— 去掉它，
       剩下的就只是又一个通用的文档方块。
       折角开到 76px（约纸宽的三成），16px 下才看得出是个角而不是毛刺。 -->
  <g filter="url(#pageShadow)">
    <path d="M160 96 H308 L384 172 V384 A32 32 0 0 1 352 416 H160 A32 32 0 0 1 128 384 V128 A32 32 0 0 1 160 96 Z"
          fill="url(#paper)"/>
  </g>
  <path d="M308 96 L384 172 L308 172 Z" fill="url(#fold)"/>

  <!-- 文字行：三行，一行比一行短，最后一行换成强调色。
       递减的长度让纸面有方向感（从上往下读）；
       琥珀色那一行是「刚写下的那一笔」，也是整块唯一的暖色。 -->
  <rect x="168" y="236" width="176" height="28" rx="14" fill="#8fae9d"/>
  <rect x="168" y="300" width="132" height="28" rx="14" fill="#c7d5cb"/>
  <rect x="168" y="364" width="76" height="28" rx="14" fill="#d98a4e"/>
</svg>

<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!--
    Nota 的应用图标。

    这一版是「按功能重画」的第二稿。第一稿的问题不在画得难看，而在
    **对比度不够**：底板是一块偏灰的青瓷绿（#4f8a6d → #274b39），纸面上
    四行文字用的是淡鼠尾草绿（#8fae9d / #c7d5cb），单看还雅，缩到任务栏
    的 16px 就只剩一块白方块 —— 深色任务栏上一片糊，浅色桌面上又跟
    别的文档图标长得一样。

    所以这一稿只改三件事：
      1. 底板梯度拉开到「深林绿 → 薄荷绿」(#1A432F → #3AC48D)，白纸压上去
         才有浮雕感，缩到多小都是一块有分量的绿。
      2. 文字行从四条减到三条，行高从 28 加到 34 / 28，颜色改成真正的
         中性板岩灰。少而粗，16px 下才看得见「这是一张写着字的纸」。
      3. 琥珀色那一行抬到最上面。原来它压在最后一行，视线找不到落点；
         现在它当标题，眼睛先落在暖色上，再顺着往下读完 —— 整块图标有了
         阅读方向。

    折角仍然是这块图标唯一的「签名」：去掉它，剩下的就只是又一个通用的
    文档方块。折角开到 78px（约纸宽的三成），小尺寸下才看得出是个角
    而不是毛刺。
  -->
  <defs>
    <!-- 底板：左上压深、右下提亮。斜向渐变比竖直渐变更像「一块有厚度的
         材料」，不会看成纯色方块。取色自一版生成稿的参考图。 -->
    <linearGradient id="bg" x1="0.06" y1="0.02" x2="0.94" y2="1">
      <stop offset="0" stop-color="#1a432f"/>
      <stop offset="0.42" stop-color="#22684a"/>
      <stop offset="0.78" stop-color="#35a077"/>
      <stop offset="1" stop-color="#3ac48d"/>
    </linearGradient>

    <!-- 纸面：几乎是纯白，只留一两档极浅的沉降。
         上一稿往下压到 #eef1ee，压在深绿底上反而显脏（像一张旧纸），
         白纸就是要白 —— 干净的白跟深绿并置，本身就是这块图标最提气的地方。 -->
    <linearGradient id="paper" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f8f7"/>
    </linearGradient>

    <!-- 折过来的那一角是纸的背面：从折线处（亮）往尖角（暗）压，
         一条渐变就把「翻过来」这件事说明白了 -->
    <linearGradient id="fold" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0" stop-color="#fafbfb"/>
      <stop offset="1" stop-color="#d6dcdb"/>
    </linearGradient>

    <filter id="pageShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="11" stdDeviation="15" flood-color="#07271a" flood-opacity="0.38"/>
    </filter>

    <!-- 折角的影子：往左下投一点点。
         没有这一下，折角只是一块贴在纸上的浅灰三角形；
         有了它，那一角才真的「翘起来」了 —— 从平面变成有厚度的一张纸。
         范围开小一点，只在折线附近起作用，不污染整张纸。 -->
    <filter id="foldShadow" x="-40%" y="-40%" width="200%" height="200%">
      <feDropShadow dx="-4" dy="4" stdDeviation="4" flood-color="#20342a" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- 圆角底板 -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- 纸面：右上角折下一角 -->
  <g filter="url(#pageShadow)">
    <path d="M156 82 H306 L382 158 V404 A26 26 0 0 1 356 430 H156 A26 26 0 0 1 130 404 V108 A26 26 0 0 1 156 82 Z"
          fill="url(#paper)"/>
  </g>
  <path d="M306 82 L382 158 L306 158 Z" fill="url(#fold)" filter="url(#foldShadow)"/>

  <!-- 内容：一行标题 + 两行正文。
       标题短而厚、用琥珀（全图唯一的暖色）；正文一行长一行短，
       右边的参差就是「一段话还没写完」的样子。
       行距刻意留得很大 —— 挤在一起又会退回第一稿那种「糊成一片」。 -->
  <rect x="166" y="178" width="122" height="34" rx="17" fill="#e3a24b"/>
  <rect x="166" y="246" width="176" height="28" rx="14" fill="#8e999c"/>
  <rect x="166" y="304" width="128" height="28" rx="14" fill="#bac3c5"/>
</svg>

<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 底板：墨绿微渐变，左上略亮 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#4a7d64"/>
      <stop offset="1" stop-color="#2f5240"/>
    </linearGradient>

    <!-- 纸面：极淡暖白 -->
    <linearGradient id="paper" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#fffefc"/>
      <stop offset="1" stop-color="#f2efe9"/>
    </linearGradient>

    <!-- 折角内侧 -->
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2ebe4"/>
      <stop offset="1" stop-color="#c6d4ca"/>
    </linearGradient>

    <filter id="paperShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1b3326" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- 圆角底板 -->
  <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#bg)"/>

  <!-- 纸面：尽量放大，只留约 15% 的底板呼吸位 -->
  <g filter="url(#paperShadow)">
    <path d="M136 64h150l100 100v244a36 36 0 0 1-36 36H136a36 36 0 0 1-36-36V100a36 36 0 0 1 36-36z"
          fill="url(#paper)"/>
  </g>

  <!-- 折角 -->
  <path d="M286 64l100 100h-72a28 28 0 0 1-28-28z" fill="url(#fold)"/>

  <!-- 文字行：只留两条，够粗、够长，16px 下仍能看出是"文字" -->
  <rect x="150" y="224" width="216" height="30" rx="15" fill="#8fae9d"/>
  <rect x="150" y="288" width="146" height="30" rx="15" fill="#c3d3c9"/>

  <!-- 强调色：左下角一枚小方块，替代原先外凸的书签。
       完全落在纸面内，小尺寸下只是一个点，不会变成毛刺。 -->
  <rect x="150" y="360" width="54" height="14" rx="7" fill="#d98a4e"/>
</svg>

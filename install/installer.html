<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>安装 Nota</title>
<style>
  /* 安装界面 —— 对齐 OpenBitFun 式的极简安装页设计语言：
     近黑底、线框动效品牌标志、大字重标题、卡片式单选、中性色胶囊按钮。
     颜色仍然搬 src/styles/tokens.css 里 [data-theme='dark'] 那套 token
     （底 #16161a、强调 #6fae8f 青瓷），保证切进主程序没有色差。
     结构：左品牌 / 右内容 / 底部胶囊按钮，标题栏自绘。
     所有交互逻辑与旧版一致：三屏切换、阶段映射、卸载模式复用同一套屏。 */
  *{box-sizing:border-box}
  /* hidden 属性必须能压住 .pill{display:inline-flex} 这类写法，
     否则 el.hidden = true 完全没反应（卸载完成页曾经因此并排出现两个「关闭」） */
  [hidden]{display:none !important}
  :root{
    --bg:#141418; --surface:#1b1c20; --raised:#232429; --sunken:#111115;
    --line:#2e2f35; --line-strong:#41434b;
    --fg:#f0efec; --fg-dim:#a5a39d; --fg-faint:#6d6b66;
    --accent:#6fae8f; --on-accent:#10160f;
    --danger:#e07a68;
    --font:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  }
  html,body{margin:0;height:100%;background:var(--bg);font-family:var(--font);
    -webkit-font-smoothing:antialiased;user-select:none;overflow:hidden;color:var(--fg)}

  /* 窗口是不透明的整块 —— 透明窗口在关掉「透明效果」的机器上会露黑边，
     圆角交给系统（Win11 无边框窗口自带），内容直接铺满。 */
  .shell{
    position:absolute;inset:0;
    background:
      radial-gradient(90% 70% at 22% 108%,rgba(111,174,143,.07),transparent 60%),
      var(--bg);
    display:flex;flex-direction:column;
  }

  /* ── 自绘标题栏：极简，图标 + 名字，跟参考图一样轻 ── */
  .bar{height:44px;flex:none;display:flex;align-items:center;gap:9px;
    padding:0 8px 0 18px;-webkit-app-region:drag}
  .bar img{width:15px;height:15px;border-radius:4px}
  .bar .name{font-size:12px;color:var(--fg-faint);letter-spacing:.02em}
  .bar .spacer{flex:1}
  .wbtn{-webkit-app-region:no-drag;width:30px;height:28px;border:none;background:none;
    border-radius:8px;color:var(--fg-faint);display:flex;align-items:center;
    justify-content:center;cursor:pointer;font-size:14px;line-height:1}
  .wbtn:hover{background:var(--raised);color:var(--fg)}
  .wbtn.close:hover{background:#8f3b2c;color:#fff}

  .body{flex:1;display:flex;min-height:0}

  /* ── 左：品牌区。线框动效标志 + 字标 + 版本，全程不动 ── */
  .brand{width:324px;flex:none;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:26px;padding-bottom:10px;
    border-right:1px solid rgba(255,255,255,.035)}
  .mark{width:196px;height:196px;display:block}
  .mark svg{width:100%;height:100%;display:block}
  .brand .word{font-size:46px;font-weight:700;letter-spacing:-.03em;color:var(--fg);
    line-height:1;font-family:"Segoe UI",var(--font)}
  .brand .ver{font-size:11.5px;color:var(--fg-faint);letter-spacing:.04em;
    font-family:var(--mono)}

  /* ── 右：内容 ── */
  .pane{flex:1;min-width:0;display:flex;flex-direction:column;
    padding:46px 44px 30px 40px;overflow:hidden}
  /* overflow-y:auto 只是兜底：系统字体比预期大或错误提示多占两行时，
     内容自己滚，而不是把底部按钮切掉。正常情况下不出滚动条。
     scrollbar-width:none —— 滚动条永远不渲染。切屏瞬间布局会有 1~2 帧
     的瞬态溢出，经典滚动条（用户关了「自动隐藏」时）会闪出一条竖杠，
     实测录屏逐帧确认过；不渲染就彻底没了，滚轮兜底仍在。 */
  .screen{display:flex;flex-direction:column;height:100%;
    overflow-y:auto;scrollbar-width:none}
  .screen::-webkit-scrollbar{width:0;height:0}
  .screen[hidden]{display:none}

  /* 参考图的标题：大、粗、有份量 */
  h1{margin:0;font-size:30px;line-height:1.3;font-weight:700;
    letter-spacing:-.02em;color:var(--fg)}
  .sub{margin:12px 0 0;font-size:13px;line-height:1.8;color:var(--fg-dim);max-width:34em}

  /* 选项：整行可点的大卡片。选中 = 实底卡片 + 强调色圆点，
     未选中 = 透明、只有圆点描边 —— 和参考图的语言一致。 */
  .opts{margin-top:30px;display:flex;flex-direction:column;gap:8px}
  .opt{display:flex;gap:14px;align-items:center;padding:15px 18px;border-radius:14px;
    background:transparent;border:1px solid transparent;cursor:pointer;
    transition:background .16s ease,border-color .16s ease}
  .opt:hover{background:rgba(255,255,255,.025)}
  .opt.on{background:var(--raised);border-color:rgba(255,255,255,.05)}
  .ot{flex:1;min-width:0}
  .dot{width:18px;height:18px;border-radius:50%;flex:none;
    border:1.5px solid var(--line-strong);position:relative;transition:border-color .16s}
  .opt.on .dot{border-color:var(--accent)}
  .opt.on .dot::after{content:"";position:absolute;inset:3.5px;border-radius:50%;
    background:var(--accent)}
  .opt .t{font-size:14.5px;color:var(--fg);font-weight:600;line-height:1.4;display:block}
  .opt .d{font-size:12px;color:#8b8983;margin-top:4px;line-height:1.6;display:block;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* 换安装位置：只在选中的「安装版」那一行露出来 */
  .browse{flex:none;height:28px;padding:0 13px;border-radius:99px;
    background:transparent;border:1px solid var(--line-strong);color:var(--fg-dim);
    font:inherit;font-size:11.5px;cursor:pointer;opacity:0;pointer-events:none;
    transition:opacity .15s ease,background .15s ease,color .15s ease}
  .opt.on .browse{opacity:1;pointer-events:auto}
  .browse:hover{background:var(--surface);color:var(--fg)}

  /* 笔记存放位置：单独一块。程序装哪儿和笔记放哪儿是两件事。 */
  .field{margin-top:18px;padding:14px 18px;border-radius:14px;
    background:rgba(255,255,255,.02);border:1px solid var(--line);
    transition:opacity .15s ease}
  .field .ft{font-size:11px;color:var(--fg-faint);letter-spacing:.03em}
  .frow{display:flex;align-items:center;gap:10px;margin-top:8px}
  .fv{flex:1;min-width:0;font-family:var(--mono);font-size:11.5px;color:var(--fg-dim);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .field .browse{opacity:1;pointer-events:auto}
  .fd{margin:8px 0 0;font-size:11px;line-height:1.65;color:#85837d}
  /* 选「免安装」时这块不生效 —— 免安装不写任何记录，别给一个按了没反应的按钮 */
  .field.off{opacity:.45}
  .field.off .browse{pointer-events:none}

  .grow{flex:1}

  .row{display:flex;align-items:center;gap:10px;justify-content:flex-end}
  .hint{font-size:11px;color:var(--fg-faint);margin-right:auto}

  /* 主按钮：参考图那种中性深色胶囊 —— 安静、克制，箭头留一点引导。
     完成页的「打开 Nota」才用强调色填充，把最终动作顶出来。 */
  .pill{height:44px;padding:0 26px;border:1px solid var(--line-strong);border-radius:99px;
    background:var(--raised);color:var(--fg);font:inherit;font-size:13.5px;
    font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:9px;
    transition:background .15s ease,border-color .15s ease,transform .08s ease}
  .pill:hover{background:#2b2c32;border-color:var(--line-strong)}
  .pill:active{transform:translateY(1px)}
  .pill[disabled]{opacity:.5;cursor:default;transform:none}
  .pill.primary{background:var(--accent);border-color:transparent;color:var(--on-accent)}
  .pill.primary:hover{filter:brightness(1.07);background:var(--accent)}
  .pill.ghost{background:transparent;border-color:var(--line);
    color:var(--fg-dim);font-weight:500;padding:0 18px}
  .pill.ghost:hover{background:var(--surface);color:var(--fg)}
  .pill.danger{background:var(--danger);border-color:transparent;color:#1a0f0c}
  .pill.danger:hover{background:var(--danger);filter:brightness(1.06)}
  .pill .arw{font-size:14px;line-height:1;margin-left:2px;opacity:.65}

  /* 进度：细、圆头，不发光不加条纹 */
  .track{height:4px;border-radius:99px;background:var(--sunken);overflow:hidden;margin-top:32px}
  .track i{display:block;height:100%;width:0;border-radius:99px;background:var(--accent);
    transition:width .22s ease}
  /* 百分比和「正在干什么」压在进度条下面一行 */
  .bmeta{display:flex;align-items:baseline;justify-content:space-between;
    gap:12px;margin-top:10px}
  .bmeta .n{font-size:11px;color:var(--fg-faint);font-family:var(--mono)}
  .bmeta .l{font-size:12px;color:var(--fg-dim);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}

  /* 步骤清单：安装只有几秒，把要做的几件事列出来，当前步亮起来 */
  .steps{list-style:none;margin:30px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
  .steps li{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--fg-faint);
    transition:color .2s ease}
  .steps .mk{width:16px;height:16px;border-radius:50%;flex:none;
    border:1.5px solid var(--line-strong);position:relative;transition:all .2s ease}
  .steps li[data-s='now']{color:var(--fg)}
  .steps li[data-s='now'] .mk{border-color:var(--accent)}
  .steps li[data-s='now'] .mk::after{content:"";position:absolute;inset:3.5px;border-radius:50%;
    background:var(--accent)}
  .steps li[data-s='done']{color:var(--fg-dim)}
  .steps li[data-s='done'] .mk{border-color:var(--accent);background:var(--accent)}
  .steps li[data-s='done'] .mk::after{content:"✓";position:absolute;inset:0;color:var(--on-accent);
    font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center}

  /* 完成屏：标题占左，对勾挪右 */
  .dhead{display:flex;align-items:flex-start;gap:20px}
  .dhead .dcopy{flex:1;min-width:0}
  .tick{width:46px;height:46px;flex:none;border-radius:50%;display:flex;
    align-items:center;justify-content:center;font-size:20px;font-weight:700;
    margin-top:2px;background:rgba(111,174,143,.14);color:var(--accent)}

  /* 结果卡：装到哪、笔记在哪、占多大、怎么启动 */
  .dcard{margin-top:28px;background:rgba(255,255,255,.02);border:1px solid var(--line);
    border-radius:16px;padding:4px 18px}
  .drow{display:flex;align-items:center;gap:14px;padding:12px 0;min-width:0}
  .drow + .drow{border-top:1px solid rgba(255,255,255,.04)}
  .dk{flex:none;width:32px;font-size:11.5px;color:var(--fg-faint)}
  .dv{flex:1;min-width:0;font-size:12px;color:var(--fg-dim);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .dv.path{font-family:var(--mono);font-size:11.5px;color:var(--fg)}

  .err{display:none;margin-top:18px;border-radius:12px;padding:11px 14px;
    background:#2a1a17;border:1px solid #4a2a24;color:var(--danger);
    font-size:11.5px;line-height:1.7;word-break:break-all}
  .err.on{display:block}
</style>
</head>
<body>
<div class="shell">
  <div class="bar">
    <img src="../icon.png" alt="">
    <span class="name">Nota 安装程序</span>
    <span class="spacer"></span>
    <button class="wbtn" id="min" title="最小化">—</button>
    <button class="wbtn close" id="close" title="关闭">✕</button>
  </div>

  <div class="body">
    <div class="brand">
      <!-- 线框动效标志：一叠「纸」绕中心旋转出的摩尔纹，
           由下面的脚本生成（同样的一叠，转满一周就是 Nota 的笔迹感） -->
      <div class="mark" id="mark"></div>
      <div class="word">Nota</div>
      <div class="ver" id="ver">版本 —</div>
    </div>

    <div class="pane">
      <!-- ① 开场 -->
      <section class="screen" id="s-welcome">
        <h1 id="w-title">安装到这台电脑</h1>
        <p class="sub" id="w-sub">笔记始终存在你自己的文件夹里，装在哪儿都不影响。</p>

        <div class="opts" id="w-opts">
          <label class="opt on" data-act="install">
            <span class="dot"></span>
            <span class="ot">
              <span class="t">安装版</span>
              <span class="d" id="w-dir"></span>
            </span>
            <button class="browse" id="w-browse" type="button">更改…</button>
          </label>
          <label class="opt" data-act="portable">
            <span class="dot"></span>
            <span class="ot">
              <span class="t">免安装，直接运行</span>
              <span class="d">不写注册表、不建快捷方式，关掉就什么也没留下</span>
            </span>
          </label>
        </div>

        <!-- 笔记放哪。默认「文档\Nota」，可以自己挑。 -->
        <div class="field" id="w-note-field">
          <span class="ft">笔记存放位置</span>
          <div class="frow">
            <span class="fv" id="w-note"></span>
            <button class="browse" id="w-note-browse" type="button">更改…</button>
          </div>
          <p class="fd" id="w-note-hint">这里会放一篇《欢迎使用 Nota》；文件夹里已经有笔记，就原样打开，一个文件都不写。</p>
        </div>

        <div class="err" id="w-err"></div>
        <div class="grow"></div>
        <div class="row">
          <button class="pill" id="w-go">继续<span class="arw">→</span></button>
        </div>
      </section>

      <!-- ② 进行中 -->
      <section class="screen" id="s-busy" hidden>
        <h1 id="b-title">正在安装</h1>
        <div class="track"><i id="b-bar"></i></div>
        <div class="bmeta">
          <span class="n" id="b-pct">0%</span>
          <span class="l" id="b-label">正在准备…</span>
        </div>
        <ul class="steps" id="b-steps">
          <li data-step="0"><span class="mk"></span>准备</li>
          <li data-step="1"><span class="mk"></span>写入程序文件</li>
          <li data-step="2"><span class="mk"></span>创建开始菜单与桌面图标</li>
          <li data-step="3"><span class="mk"></span>登记卸载信息</li>
          <li data-step="4"><span class="mk"></span>准备笔记目录</li>
        </ul>
        <div class="grow"></div>
        <div class="row"><span class="hint">装完会自己打开，不用再点一次</span></div>
      </section>

      <!-- ③ 完成 -->
      <section class="screen" id="s-done" hidden>
        <div class="dhead">
          <div class="dcopy">
            <h1 id="d-title">装好了</h1>
            <p class="sub" id="d-sub">开始菜单和桌面都有入口；想卸掉的话，设置里或「应用和功能」里都能找到。</p>
          </div>
          <div class="tick">✓</div>
        </div>
        <div class="dcard" id="d-card">
          <div class="drow"><span class="dk">位置</span><span class="dv path" id="d-dir"></span></div>
          <div class="drow"><span class="dk">笔记</span><span class="dv path" id="d-notes"></span></div>
          <div class="drow"><span class="dk">占用</span><span class="dv" id="d-size"></span></div>
          <div class="drow"><span class="dk">启动</span><span class="dv">桌面双击图标，或开始菜单里搜 Nota</span></div>
        </div>
        <div class="grow"></div>
        <div class="row">
          <button class="pill ghost" id="d-close">关闭</button>
          <button class="pill primary" id="d-open">打开 Nota<span class="arw">→</span></button>
        </div>
      </section>
    </div>
  </div>
</div>

<script>
  /* ── 品牌标志：一叠圆角矩形绕中心旋转出的摩尔纹。
     纯静态 SVG 就够 —— 安装窗只活几十秒，动效反而显得躁。
     方形从 64 长到 176，每张转 6°，线色带一点青瓷的灰绿。 */
  ;(function paintMark() {
    const NS = 'http://www.w3.org/2000/svg'
    const svg = document.createElementNS(NS, 'svg')
    svg.setAttribute('viewBox', '0 0 200 200')
    const N = 22
    for (let i = 0; i < N; i++) {
      const r = document.createElementNS(NS, 'rect')
      const size = 64 + (176 - 64) * (i / (N - 1))
      r.setAttribute('x', 100 - size / 2)
      r.setAttribute('y', 100 - size / 2)
      r.setAttribute('width', size)
      r.setAttribute('height', size)
      r.setAttribute('rx', size * 0.24)
      r.setAttribute('transform', `rotate(${i * 6} 100 100)`)
      r.setAttribute('fill', 'none')
      r.setAttribute('stroke', '#9fc2af')
      r.setAttribute('stroke-width', '1')
      r.setAttribute('opacity', (0.10 + 0.38 * (1 - i / (N - 1))).toFixed(3))
      svg.appendChild(r)
    }
    document.getElementById('mark').appendChild(svg)
  })()

  const api = window.notaInstall
  const $ = (s) => document.querySelector(s)
  let exe = ''
  let mode = 'install'
  let choice = 'install'

  // 三屏只有一个是活的。注意是 !== ：写反了会把「当前这屏」藏起来、
  // 另外两屏同时摊开 —— 表现是进度条停在那、底下又冒出「装好了」。
  const show = (id) => {
    for (const s of ['#s-welcome', '#s-busy', '#s-done']) $(s).hidden = s !== id
  }

  // 主进程报上来的「阶段」只有一句中文，这里映射到清单的第几步。
  // 文案改了忘了改这儿 → 清单不动，但进度条照走，不至于卡住界面。
  const STEP_OF = {
    正在准备: 0,
    正在写入文件: 1,
    正在创建快捷方式: 2,
    正在登记卸载信息: 3,
    正在准备笔记目录: 4,
  }

  const paintSteps = (label) => {
    const key = label.replace(/…|\.\.\./g, '').trim()
    const now = STEP_OF[key]
    if (now === undefined) return
    for (const li of document.querySelectorAll('#b-steps li')) {
      const i = Number(li.dataset.step)
      li.dataset.s = i < now ? 'done' : i === now ? 'now' : ''
    }
  }

  api.onPhase((p) => {
    $('#b-label').textContent = p.label + '…'
    // 拷贝走完就报 100%，但后面还有建快捷方式、写注册表两件事。
    // 停在 100% 却还在转，比 99% 更让人犯嘀咕，所以这两步压到 99。
    const key = p.label.replace(/…|\.\.\./g, '').trim()
    const shown = (STEP_OF[key] ?? 0) >= 2 ? Math.min(99, p.percent) : p.percent
    $('#b-bar').style.width = Math.max(0, Math.min(100, shown)) + '%'
    $('#b-pct').textContent = shown + '%'
    paintSteps(p.label)
  })

  const setDir = (p) => {
    $('#w-dir').textContent = p
    $('#w-dir').title = p
  }

  const setNotes = (p) => {
    $('#w-note').textContent = p
    $('#w-note').title = p
  }

  const NOTE_HINT = {
    on: '这里会放一篇《欢迎使用 Nota》；文件夹里已经有笔记，就原样打开，一个文件都不写。',
    off: '免安装模式不记录位置：第一次启动用默认的「文档\\Nota」，之后在工作区里随时能换。',
  }

  api.info().then((i) => {
    mode = i.mode
    $('#ver').textContent = '版本 ' + i.version
    setDir(i.dir)
    if (i.notes) setNotes(i.notes)
    if (mode === 'uninstall') {
      $('#w-title').textContent = '卸载 Nota'
      $('#w-sub').textContent = '只删程序和快捷方式。笔记、设置、云同步的配置都留在原处。'
      $('#w-opts').hidden = true
      // 卸载没有「选笔记目录」这回事，整块收起来
      $('#w-note-field').hidden = true
      $('#w-go').classList.add('danger')
      $('#w-go').textContent = '卸载'
      $('#b-title').textContent = '正在卸载'
      // 卸载是另一套动作，清单对不上，直接收起来
      $('#b-steps').hidden = true
    }
  })

  $('#w-opts').addEventListener('click', async (e) => {
    // 「更改…」是按钮，不是选项 —— 先拦下来，别让它顺带把选中项换掉
    if (e.target.closest('.browse')) {
      e.preventDefault()
      e.stopPropagation()
      const dir = await api.chooseDir()
      if (dir) setDir(dir)
      return
    }
    const row = e.target.closest('.opt')
    if (!row) return
    for (const r of document.querySelectorAll('.opt')) r.classList.toggle('on', r === row)
    choice = row.dataset.act
    $('#w-go').innerHTML = choice === 'portable'
      ? '直接运行<span class="arw">→</span>'
      : '继续<span class="arw">→</span>'
    // 「免安装」不写任何记录，笔记位置这块对它不生效 —— 灰掉并说清楚，
    // 别留一个按了没反应的按钮让人反复点
    const portable = choice === 'portable'
    $('#w-note-field').classList.toggle('off', portable)
    $('#w-note-hint').textContent = portable ? NOTE_HINT.off : NOTE_HINT.on
  })

  // 笔记目录是独立的（不在 .opts 里，所以不会被上面那段顺手改掉选中项）
  $('#w-note-browse').onclick = async () => {
    const dir = await api.chooseNotes()
    if (dir) setNotes(dir)
  }

  // 清空进度条与清单，重试时才是从零开始，不会停在上一轮的 94%
  const resetBusy = () => {
    $('#b-bar').style.width = '0%'
    $('#b-pct').textContent = '0%'
    for (const li of document.querySelectorAll('#b-steps li')) li.dataset.s = ''
  }

  $('#w-go').onclick = async () => {
    if (mode === 'install' && choice === 'portable') return api.usePortable()
    $('#w-err').classList.remove('on')
    resetBusy()
    show('#s-busy')
    const r = await api.start()
    if (!r.ok) {
      // 失败一律退回第一屏并把原文摊出来
      show('#s-welcome')
      $('#w-err').textContent = r.error || '出错了，换个位置再试一次。'
      $('#w-err').classList.add('on')
      return
    }
    // 最后一步的进度条停在 100 才切屏，否则会看到 94% 直接跳走
    $('#b-bar').style.width = '100%'
    $('#b-pct').textContent = '100%'
    for (const li of document.querySelectorAll('#b-steps li')) li.dataset.s = 'done'
    await new Promise((r) => setTimeout(r, 180))
    exe = r.exe || ''
    if (mode === 'uninstall') {
      $('#d-title').textContent = '卸掉了'
      $('#d-sub').textContent = '笔记还在原来的文件夹里，重装回来接着用即可。'
      $('#d-card').hidden = true
      $('#d-open').textContent = '关闭'
      $('#d-open').onclick = () => api.quit()
      $('#d-close').hidden = true
    } else {
      $('#d-dir').textContent = r.dir || ''
      $('#d-dir').title = r.dir || ''
      $('#d-notes').textContent = r.notes || ''
      $('#d-notes').title = r.notes || ''
      $('#d-size').textContent = r.bytes
        ? (r.bytes / 1048576).toFixed(1) + ' MB · 含程序与运行库'
        : ''
      $('#d-sub').textContent =
        '第一次打开会直接落在那篇《欢迎使用 Nota》上。想卸掉的话，设置里或「应用和功能」里都能找到。'
    }
    show('#s-done')
  }

  $('#d-open').onclick = () => api.launch(exe)
  $('#d-close').onclick = () => api.quit()
  $('#min').onclick = () => api.minimize()
  $('#close').onclick = () => api.quit()
</script>
</body>
</html>

# Nota 官网 + 下载 + 后台（Cloudflare Workers + D1 + R2）
#
# 部署前要改一处：
#   database_id —— 跑完 `wrangler d1 create nota` 会打印出来，粘进来
#
# 密钥不要写在任何文件里：
#   wrangler secret put SESSION_SECRET

name = "nota"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# 当前版本号。下载文件名、官网按钮上的版本文字都从这里来 ——
# 发版时改这一个值，别的地方不用动。
# （其实也不用手动改：npm run pack 会把它跟 package.json 对齐）
[vars]
VERSION = "2.7.3"

# 官网静态文件。只有 /d /api /admin 三条路先过 Worker，
# 其余（/、/icon.png、/shots/*）由边缘直接吐，不占 Worker 调用次数。
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/d/*", "/api/*", "/admin"]

[[d1_databases]]
binding = "DB"
database_name = "nota"
database_id = "REPLACE_WITH_YOUR_DATABASE_ID"

[[r2_buckets]]
binding = "FILES"
bucket_name = "nota-downloads"

# 站点域名。custom_domain 会顺手把 DNS 和证书一起配好，
# 前提是 hyper99.top 这个 zone 已经接在同一个 Cloudflare 账号下 ——
# ymtj 这条子域不用自己先建 A/CNAME，wrangler 会写。
[[routes]]
pattern = "ymtj.hyper99.top"
custom_domain = true

[observability]
enabled = true
